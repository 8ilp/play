<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع يوسف</title>
    <!-- ربط ملف الإعدادات عشان المتصفح يتعرف على التطبيق -->
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e2f;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-container {
            background: #2a2a40;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #3f3f5f;
            z-index: 10;
        }

        h2 { color: #ffb703; margin-top: 0; }

        /* زر التنزيل */
        #install-btn {
            background-color: #ffb703;
            color: #1e1e2f;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
            display: none; /* مخفي بالبداية لين جاهز للتنزيل */
        }

        #install-btn:hover {
            background-color: #fb8500;
        }

        /* حاوية القطة المتحركة في الأسفل */
        #bongo-cat {
            position: fixed;
            bottom: 0;
            left: 50%;
            width: 350px;
            pointer-events: none;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>موقع يوسف</h2>
        <p>مرحباً بك! التطبيق جاهز للعمل.</p>
        <!-- زر التنزيل الظاهر للمستخدم -->
        <button id="install-btn">تحميل تطبيق يوسف</button>
    </div>

    <!-- القطة المتحركة (تأكد أن اسم الصورة cat.gif) -->
    <img id="bongo-cat" src="cat.gif" alt="Bongo Cat">

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        // استقبال حدث التثبيت من المتصفح
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block'; // إظهار الزر للمستخدم
        });

        // عند الضغط على زر التنزيل
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('تم قبول التثبيت');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        // حركة القطة مع الماوس
        document.addEventListener('mousemove', (e) => {
            const cat = document.getElementById('bongo-cat');
            let moveX = (e.clientX / window.innerWidth - 0.5) * 40; 
            cat.style.transform = `translateX(calc(-50% + ${moveX}px))`;
        });
    </script>

</body>
</html>
