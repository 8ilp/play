<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع يوسف</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e2f;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-container {
            background: #2a2a40;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #3f3f5f;
            margin-bottom: 180px;
        }

        h2 { color: #ffb703; margin-top: 0; }

        #install-btn {
            background-color: #ffb703;
            color: #1e1e2f;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            display: none;
        }

        #install-btn:hover {
            background-color: #fb8500;
        }

        /* حاوية بونجو كات المطابقة للأصل (قطة + ماوس + كيبورد) */
        #bongo-scene {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            height: 160px;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 20px;
        }

        /* طاولة العمل */
        .desk-surface {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 4px;
            background: #fff;
        }

        /* تصميم الماوس باد والماوس ع اليسار */
        .mouse-area {
            position: relative;
            width: 90px;
            height: 50px;
            background: #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mouse {
            width: 25px;
            height: 40px;
            background: #111;
            border-radius: 12px;
            border: 2px solid #555;
        }

        /* تصميم الكيبورد ع اليمين */
        .keyboard-area {
            width: 220px;
            height: 60px;
            background: #111;
            border: 3px solid #444;
            border-radius: 8px;
            box-shadow: 0 4px 0 #000;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            padding: 6px;
        }
        .kb-key {
            background: #ddd;
            border-radius: 2px;
        }

        /* رأس وجسم القطة في المنتصف */
        .cat-head {
            position: absolute;
            left: 50%;
            bottom: 35px;
            transform: translateX(-50%);
            width: 180px;
            height: 110px;
            background: #ffffff;
            border: 4px solid #111;
            border-radius: 90px 90px 30px 30px;
            box-shadow: 0 6px 0 #111;
        }

        /* أذان القطة */
        .cat-ear {
            position: absolute;
            top: -22px;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid #ffffff;
            border-top: 4px solid #111; /* حدود سوداء للأذن */
        }
        .cat-ear.left { left: 20px; transform: rotate(-15deg); }
        .cat-ear.right { right: 20px; transform: rotate(15deg); }

        /* وجه القطة وتفاصيلها */
        .cat-face-details {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
            font-weight: bold;
            color: #111;
            letter-spacing: 8px;
        }

        /* اليدين (الكفوف) */
        .paw {
            position: absolute;
            width: 28px;
            height: 22px;
            background: #ffffff;
            border: 3px solid #111;
            border-radius: 50%;
        }
        .paw.left-paw {
            bottom: 10px;
            left: 65px;
            animation: moveMouse 0.3s infinite alternate;
        }
        .paw.right-paw {
            bottom: 10px;
            right: 65px;
            animation: moveKey 0.15s infinite alternate;
        }

        /* حركات الكفوف الواقعية */
        @keyframes moveMouse {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(-10deg); }
        }
        @keyframes moveKey {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>موقع يوسف</h2>
        <p>القطة جاهزة بالماوس والكيبورد!</p>
        <button id="install-btn">تحميل تطبيق يوسف</button>
    </div>

    <!-- مشهد بونجو كات المتكامل -->
    <div id="bongo-scene">
        <div class="desk-surface"></div>
        <!-- الماوس والماوس باد -->
        <div class="mouse-area">
            <div class="mouse"></div>
        </div>
        
        <!-- القطة والجسم والأذان والكفوف -->
        <div class="cat-head">
            <div class="cat-ear left"></div>
            <div class="cat-ear right"></div>
            <div class="cat-face-details">> . <</div>
            <div class="paw left-paw"></div>
            <div class="paw right-paw"></div>
        </div>

        <!-- الكيبورد -->
        <div class="keyboard-area">
            <!-- أزرار وهمية تعطي شكل الكيبورد الحقيقي -->
            <script>
                for(let i=0; i<20; i++) {
                    document.write('<div class="kb-key"></div>');
                }
            </script>
        </div>
    </div>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        // تحريك المشهد بالكامل مع الماوس
        document.addEventListener('mousemove', (e) => {
            const scene = document.getElementById('bongo-scene');
            let moveX = (e.clientX / window.innerWidth - 0.5) * 25; 
            scene.style.transform = `translateX(calc(-50% + ${moveX}px))`;
        });
    </script>

</body>
</html>
