<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة يوسف - سب واي</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 { margin: 5px; color: #ffb703; font-size: 24px; }
        
        /* شاشة اللعبة */
        canvas {
            background: #222;
            border: 4px solid #ffb703;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* زر التحميل */
        #install-btn {
            background-color: #ffb703;
            color: #111;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        #install-btn:hover { background-color: #fb8500; }
    </style>
</head>
<body>

    <h1>لعبة يوسف للركض</h1>
    <p>استخدم أسهم لوحة المفاتيح (اليمين واليسار) لتغيير المسار وتفادي الحواجز!</p>

    <!-- لوحة اللعبة -->
    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <!-- زر التحميل -->
    <button id="install-btn">تحميل اللعبة كطبيق</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // إحداثيات اللاعب (يبدأ في المسار الأوسط)
        let player = {
            lane: 1, // 0: يسار، 1: وسط، 2: يمين
            x: 200,
            y: 400,
            width: 30,
            height: 50,
            color: "#ffb703"
        };

        const lanes = [100, 200, 300]; // أماكن المسارات الثلاثة بالعرض
        let obstacles = [];
        let score = 0;
        let gameRunning = true;
        let speed = 4;

        // التحكم بالأزرار (يمين ويسار)
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight" && player.lane < 2) {
                player.lane++;
            } else if (e.key === "ArrowLeft" && player.lane > 0) {
                player.lane--;
            }
        });

        // إضافة حواجز عشوائية
        function spawnObstacle() {
            if (Math.random() < 0.02) {
                let randomLane = Math.floor(Math.random() * 3);
                obstacles.push({
                    lane: randomLane,
                    y: -50,
                    width: 40,
                    height: 40,
                    color: "#e63946"
                });
            }
        }

        // تحديث رسومات وحركة اللعبة
        function update() {
            if (!gameRunning) return;

            // تحريك اللاعب بسلاسة للمسار المطلوب
            player.x += (lanes[player.lane] - player.x) * 0.2;

            // تحريك الحواجز للأسفل
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].y += speed;

                // فحص الاصطدام (إذا الحواجز ضربت اللاعب)
                if (
                    obstacles[i].lane === player.lane &&
                    obstacles[i].y + obstacles[i].height > player.y &&
                    obstacles[i].y < player.y + player.height
                ) {
                    gameRunning = false;
                }
            }

            // حذف الحواجز التي تجاوزت الشاشة وزيادة النقاط
            obstacles = obstacles.filter(obs => {
                if (obs.y > canvas.height) {
                    score += 10;
                    return false;
                }
                return true;
            });

            spawnObstacle();
        }

        function draw() {
            // تنظيف الشاشة
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم مسارات الطريق (خطوط طولية)
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(150, 0); ctx.lineTo(150, canvas.height);
            ctx.moveTo(250, 0); ctx.lineTo(250, canvas.height);
            ctx.stroke();

            // رسم اللاعب
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x - player.width / 2, player.y, player.width, player.height);

            // رسم الحواجز
            for (let i = 0; i < obstacles.length; i++) {
                ctx.fillStyle = obstacles[i].color;
                ctx.fillRect(lanes[obstacles[i].lane] - obstacles[i].width / 2, obstacles[i].y, obstacles[i].width, obstacles[i].height);
            }

            // رسم النقاط
            ctx.fillStyle = "#fff";
            ctx.font = "18px Tahoma";
            ctx.fillText("النقاط: " + score, 20, 30);

            if (!gameRunning) {
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffb703";
                ctx.font = "28px Tahoma";
                ctx.fillText("خسرت يا يوسف!", 100, 220);
                ctx.font = "16px Tahoma";
                ctx.fillText("اضغط F5 لإعادة اللعب", 125, 270);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        // زر التحميل
        document.getElementById("install-btn").addEventListener("click", () => {
            alert('لتثبيت اللعبة كتطبيق على جهازك، افتح قائمة المتصفح (النقاط الثلاث) واختار "تثبيت التطبيق" (Install app).');
        });
    </script>
</body>
</html>
