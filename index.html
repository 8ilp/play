<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة سيارات يوسف</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 { margin: 5px; color: #ffb703; font-size: 20px; }
        
        canvas {
            background: #222;
            border: 4px solid #ffb703;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            outline: none;
        }

        #install-btn {
            background-color: #ffb703;
            color: #111;
            border: none;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
        }
        #install-btn:hover { background-color: #fb8500; }
    </style>
</head>
<body>

    <h1>لعبة سيارات يوسف</h1>
    <p style="margin: 5px; font-size: 13px;">اضغط على الشاشة بالماوس، واستخدم الأسهم (يسار/يمين) للهروب وجمع الفلوس</p>

    <canvas id="gameCanvas" width="360" height="480" tabindex="1"></canvas>
    <button id="install-btn">تحميل اللعبة كتطبيق</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        canvas.focus();
        window.addEventListener('click', () => canvas.focus());

        let player = {
            lane: 1, 
            x: 180,
            y: 360,
            width: 32,
            height: 56,
            color: "#3a86ff"
        };

        const lanes = [95, 180, 265]; 
        let obstacles = [];
        let coins = [];
        let score = 0;
        let moneyCount = 0;
        let gameRunning = true;
        let speed = 4;
        let spawnTimer = 0;

        document.addEventListener("keydown", (e) => {
            if(["ArrowLeft", "ArrowRight", "Enter"].includes(e.key)) {
                e.preventDefault();
            }

            if (gameRunning) {
                if (e.key === "ArrowRight" && player.lane < 2) {
                    player.lane++;
                } else if (e.key === "ArrowLeft" && player.lane > 0) {
                    player.lane--;
                }
            } else {
                if (e.key === "Enter") {
                    resetGame();
                }
            }
        });

        function resetGame() {
            player.lane = 1;
            obstacles = [];
            coins = [];
            score = 0;
            moneyCount = 0;
            speed = 4;
            spawnTimer = 0;
            gameRunning = true;
        }

        function spawnElements() {
            spawnTimer++;
            // نخليه ينزل سيارات بانتظام (كل فترة زمنية محددة بدلاً من العشوائية المطلقة)
            if (spawnTimer > 45) {
                spawnTimer = 0;
                
                // نختار مسارين فقط للسيارات ونترك مسار واحد آمن 100% غصباً عن الكل
                let availableLanes = [0, 1, 2];
                // نحذف مسار عشوائي عشان يبقى دايماً فيه طريق مفتوح
                let safeLaneIndex = Math.floor(Math.random() * 3);
                availableLanes.splice(safeLaneIndex, 1);

                // ننزل سيارتين في المسارين الباقيين كحد أقصى
                availableLanes.forEach(lane => {
                    obstacles.push({
                        lane: lane,
                        y: -100,
                        width: 32,
                        height: 56,
                        color: "#e63946"
                    });
                });

                // أحياناً نحط فلوس في المسار الآمن عشان نكافئ اللاعب
                if (Math.random() < 0.7) {
                    coins.push({
                        lane: safeLaneIndex,
                        y: -30,
                        size: 13
                    });
                }
            }
        }

        function update() {
            if (!gameRunning) return;

            speed += 0.0006;
            player.x += (lanes[player.lane] - player.x) * 0.4;

            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].y += speed;

                let marginX = 6;
                let marginY = 10;
                if (
                    obstacles[i].lane === player.lane &&
                    obstacles[i].y + obstacles[i].height - marginY > player.y + marginY &&
                    obstacles[i].y + marginY < player.y + player.height - marginY
                ) {
                    gameRunning = false;
                }
            }

            for (let i = 0; i < coins.length; i++) {
                coins[i].y += speed;
                if (
                    coins[i].lane === player.lane &&
                    coins[i].y + coins[i].size > player.y &&
                    coins[i].y - coins[i].size < player.y + player.height
                ) {
                    moneyCount += 10;
                    coins.splice(i, 1);
                    i--;
                }
            }

            obstacles = obstacles.filter(obs => {
                if (obs.y > canvas.height) {
                    score += 5;
                    return false;
                }
                return true;
            });

            coins = coins.filter(c => c.y < canvas.height);
            spawnElements();
        }

        function drawCar(x, y, color) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(-16, -28, 32, 56, 7);
            ctx.fill();

            ctx.fillStyle = "#111";
            ctx.fillRect(-12, -14, 24, 14);
            ctx.fillRect(-12, 8, 24, 10);

            ctx.fillStyle = "#000";
            ctx.fillRect(-20, -18, 5, 12);
            ctx.fillRect(15, -18, 5, 12);
            ctx.fillRect(-20, 10, 5, 12);
            ctx.fillRect(15, 10, 5, 12);

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#444";
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(137, 0); ctx.lineTo(137, canvas.height);
            ctx.moveTo(222, 0); ctx.lineTo(222, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            for (let i = 0; i < coins.length; i++) {
                ctx.fillStyle = "#ffb703";
                ctx.beginPath();
                ctx.arc(lanes[coins[i].lane], coins[i].y, coins[i].size, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#d4af37";
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = "#fff";
                ctx.font = "bold 11px Tahoma";
                ctx.fillText("$", lanes[coins[i].lane] - 3, coins[i].y + 4);
            }

            drawCar(player.x, player.y + player.height/2, player.color);

            for (let i = 0; i < obstacles.length; i++) {
                drawCar(lanes[obstacles[i].lane], obstacles[i].y + obstacles[i].height/2, obstacles[i].color);
            }

            ctx.fillStyle = "#fff";
            ctx.font = "14px Tahoma";
            ctx.fillText("النقاط: " + score, 15, 25);
            ctx.fillStyle = "#ffb703";
            ctx.fillText("الفلوس: $" + moneyCount, 260, 25);

            if (!gameRunning) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#e63946";
                ctx.font = "bold 24px Tahoma";
                ctx.textAlign = "center";
                ctx.fillText("إصطدمت السيارة!", canvas.width / 2, 160);

                ctx.fillStyle = "#fff";
                ctx.font = "15px Tahoma";
                ctx.fillText("النقاط النهائية: " + score, canvas.width / 2, 210);
                ctx.fillText("الفلوس المجمعة: $" + moneyCount, canvas.width / 2, 245);

                ctx.fillStyle = "#ffb703";
                ctx.font = "bold 16px Tahoma";
                ctx.fillText("اضغط على زر (Enter) لإعادة اللعب", canvas.width / 2, 310);
                
                ctx.textAlign = "start";
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

        document.getElementById("install-btn").addEventListener("click", () => {
            alert('لتثبيت اللعبة كتطبيق على جهازك، افتح قائمة المتصفح (النقاط الثلاث) واختار "تثبيت التطبيق" (Install app).');
        });
    </script>
</body>
</html>
