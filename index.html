<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سباوي من سوق الجمعه</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { background: #222; border: 4px solid #ffb703; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); outline: none; }
        #install-btn { background-color: #ffb703; color: #111; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="360" height="480" tabindex="1"></canvas>
    <button id="install-btn">تحميل اللعبة كتطبيق</button>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.focus();
        let player = { lane: 1, x: 180, y: 360, width: 32, height: 56, color: "#3a86ff" };
        const lanes = [95, 180, 265]; 
        let obstacles = [], coins = [], score = 0, moneyCount = 0, gameRunning = true, speed = 4, spawnTimer = 0;

        document.addEventListener("keydown", (e) => {
            if (gameRunning) {
                if (e.key === "ArrowRight" && player.lane < 2) player.lane++;
                else if (e.key === "ArrowLeft" && player.lane > 0) player.lane--;
            } else if (e.key === "Enter") {
                player.lane = 1; obstacles = []; coins = []; score = 0; moneyCount = 0; speed = 4; gameRunning = true;
            }
        });

        function update() {
            if (!gameRunning) return;
            speed += 0.0006;
            player.x += (lanes[player.lane] - player.x) * 0.4;
            spawnTimer++;
            if (spawnTimer > 45) {
                spawnTimer = 0;
                let availableLanes = [0, 1, 2];
                let safeLaneIndex = Math.floor(Math.random() * 3);
                availableLanes.splice(safeLaneIndex, 1);
                availableLanes.forEach(lane => obstacles.push({ lane, y: -100, width: 32, height: 56, color: "#e63946" }));
                if (Math.random() < 0.7) coins.push({ lane: safeLaneIndex, y: -30, size: 13 });
            }
            obstacles.forEach(obs => {
                obs.y += speed;
                if (obs.lane === player.lane && obs.y + 46 > 370 && obs.y < 416) gameRunning = false;
            });
            coins.forEach((c, i) => {
                c.y += speed;
                if (c.lane === player.lane && c.y + 13 > 360 && c.y - 13 < 416) { moneyCount += 10; coins.splice(i, 1); }
            });
            obstacles = obstacles.filter(o => { if(o.y > 480) { score += 5; return false; } return true; });
        }

        function draw() {
            ctx.clearRect(0, 0, 360, 480);
            ctx.strokeStyle = "#444"; ctx.setLineDash([12, 12]);
            ctx.beginPath(); ctx.moveTo(137, 0); ctx.lineTo(137, 480); ctx.moveTo(222, 0); ctx.lineTo(222, 480); ctx.stroke();
            coins.forEach(c => { ctx.fillStyle = "#ffb703"; ctx.beginPath(); ctx.arc(lanes[c.lane], c.y, 13, 0, Math.PI * 2); ctx.fill(); });
            ctx.fillStyle = player.color; ctx.fillRect(player.x - 16, player.y - 28, 32, 56);
            obstacles.forEach(o => { ctx.fillStyle = o.color; ctx.fillRect(lanes[o.lane] - 16, o.y - 28, 32, 56); });
            ctx.fillStyle = "#fff"; ctx.font = "14px Tahoma"; ctx.fillText("النقاط: " + score, 10, 20); ctx.fillText("الفلوس: $" + moneyCount, 280, 20);
            if (!gameRunning) {
                ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0,0,360,480);
                ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "20px Tahoma"; ctx.fillText("اضغط (Enter) لإعادة اللعب", 180, 240);
            }
        }
        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
        document.getElementById("install-btn").onclick = () => alert('افتح إعدادات المتصفح واختر "تثبيت التطبيق"');
    </script>
</body>
</html>
