<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>💬 شات</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--bg2:#141c2b;--bg3:#0d1422;--br:#1a2a4a;--tx:#e0e7f0;--tx2:#94a3b8;--ac:#38bdf8;--ac2:#818cf8;--gr:#4ade80;--rd:#f87171;--or:#fbbf24;--pu:#a855f7}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{max-width:1000px;width:100%;background:var(--bg2);border-radius:24px;padding:25px;border:1px solid var(--br);box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 40px rgba(56,189,248,.05)}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:20px}
.login-screen .icon{font-size:4rem;margin-bottom:-10px}
.login-screen h1{font-size:2.8rem;font-weight:900;background:linear-gradient(135deg,#38bdf8,#818cf8,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px}
.login-screen .sub{color:var(--tx2);font-size:.95rem;margin-top:-5px}
.login-screen .sub span{color:var(--gr);font-weight:600}
.login-screen input{padding:14px 24px;border-radius:14px;border:2px solid var(--br);background:var(--bg3);color:var(--tx);font-size:1.1rem;width:100%;max-width:380px;outline:none;transition:.3s;text-align:center;font-weight:500}
.login-screen input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(56,189,248,.15)}
.login-screen input::placeholder{color:#4a5a7a;font-weight:400}
.login-screen .btn{background:linear-gradient(135deg,#38bdf8,#818cf8);color:#0a0e1a;border:none;padding:14px 48px;border-radius:14px;font-weight:700;font-size:1.1rem;cursor:pointer;transition:.3s;width:100%;max-width:380px;letter-spacing:.5px}
.login-screen .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(56,189,248,.35)}
.login-screen .btn:active{transform:scale(.97)}
.login-screen .footer-text{color:var(--tx2);font-size:.75rem;margin-top:5px}
.login-screen .footer-text span{color:var(--or)}
.chat-area{display:none;flex-direction:column;gap:15px}
.chat-area.show{display:flex}
.chat-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:15px;border-bottom:1px solid var(--br);flex-wrap:wrap;gap:10px}
.chat-header .title{font-size:1.4rem;font-weight:800;color:var(--ac);display:flex;align-items:center;gap:10px}
.chat-header .title .beta{font-size:.55rem;background:var(--bg3);color:var(--or);padding:2px 12px;border-radius:12px;border:1px solid var(--or);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.chat-header .users-online{color:var(--tx2);font-size:.9rem;font-weight:500}
.chat-header .users-online span{color:var(--gr);font-weight:700}
.main-chat{display:flex;gap:15px;min-height:450px}
.users-list{width:200px;background:var(--bg3);border-radius:14px;padding:15px;border:1px solid var(--br);max-height:450px;overflow-y:auto}
.users-list h4{color:var(--tx2);font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;text-align:center;font-weight:600}
.user-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;cursor:pointer;transition:.25s;margin-bottom:3px;font-size:.9rem;border:1px solid transparent}
.user-item:hover{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.2);transform:translateX(-3px)}
.user-item.active{border-color:var(--ac);background:rgba(56,189,248,.08)}
.user-item .dot{width:8px;height:8px;border-radius:50%;background:var(--gr);display:inline-block;animation:pulse 2s infinite;flex-shrink:0}
.user-item .dot.offline{background:#4a5a7a;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.user-item .name{flex:1;color:var(--tx);font-weight:500;font-size:.85rem}
.user-item .name .me{color:var(--tx2);font-size:.7rem;font-weight:400}
.user-item .private-badge{font-size:.5rem;color:var(--or);background:rgba(251,191,36,.1);padding:2px 8px;border-radius:10px;border:1px solid rgba(251,191,36,.2);font-weight:600;text-transform:uppercase}
.messages-area{flex:1;background:var(--bg3);border-radius:14px;padding:15px;border:1px solid var(--br);max-height:450px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.messages-area .empty-state{color:var(--tx2);text-align:center;padding:50px 0;font-size:.95rem;font-weight:400}
.messages-area .empty-state .emoji{font-size:2.5rem;display:block;margin-bottom:10px}
.message{max-width:82%;padding:10px 16px;border-radius:14px;font-size:.92rem;line-height:1.6;word-wrap:break-word;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.message.own{background:linear-gradient(135deg,#2563eb,#3b82f6);align-self:flex-end;border-bottom-left-radius:4px;color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.2)}
.message.other{background:var(--bg2);align-self:flex-start;border-bottom-right-radius:4px;border:1px solid var(--br)}
.message.private{background:linear-gradient(135deg,#2a1a4a,#4a1a6a);align-self:center;border:1px solid var(--pu);border-radius:14px;max-width:90%}
.message .sender{font-size:.7rem;color:var(--tx2);margin-bottom:2px;display:block;font-weight:600}
.message .sender.private-label{color:var(--pu)}
.message .time{font-size:.55rem;color:var(--tx2);margin-top:4px;display:block;text-align:left;opacity:.7}
.message.system{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.15);align-self:center;color:var(--or);font-size:.8rem;border-radius:20px;padding:6px 18px;max-width:70%}
.input-area{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.input-area .private-indicator{color:var(--pu);font-size:.8rem;padding:5px 14px;background:rgba(168,85,247,.08);border-radius:10px;border:1px solid rgba(168,85,247,.15);display:none;align-items:center;gap:8px;font-weight:500;width:100%}
.input-area .private-indicator.show{display:inline-flex}
.input-area .private-indicator .close{color:var(--rd);cursor:pointer;font-weight:700;margin-right:5px;padding:0 4px;border-radius:4px;transition:.2s}
.input-area .private-indicator .close:hover{background:rgba(248,113,113,.1)}
.input-area input{flex:1;padding:12px 18px;border-radius:12px;border:2px solid var(--br);background:var(--bg3);color:var(--tx);outline:none;transition:.3s;min-width:150px;font-size:.95rem}
.input-area input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(56,189,248,.1)}
.input-area input:disabled{opacity:.4;cursor:not-allowed}
.input-area .btn{background:linear-gradient(135deg,#38bdf8,#818cf8);color:#0a0e1a;border:none;padding:12px 28px;border-radius:12px;font-weight:700;font-size:.95rem;cursor:pointer;transition:.3s;white-space:nowrap}
.input-area .btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(56,189,248,.3)}
.input-area .btn:active{transform:scale(.97)}
.input-area .btn.private-btn{background:linear-gradient(135deg,#7c3aed,#a855f7);box-shadow:0 4px 20px rgba(124,58,237,.3)}
.users-list::-webkit-scrollbar,.messages-area::-webkit-scrollbar{width:4px}
.users-list::-webkit-scrollbar-track{background:var(--bg3)}
.users-list::-webkit-scrollbar-thumb{background:var(--br);border-radius:10px}
.messages-area::-webkit-scrollbar-track{background:var(--bg3)}
.messages-area::-webkit-scrollbar-thumb{background:var(--br);border-radius:10px}
@media(max-width:768px){.main-chat{flex-direction:column}.users-list{width:100%;max-height:150px}.messages-area{max-height:300px}.login-screen h1{font-size:2rem}.container{padding:18px}}
</style>
</head>
<body>
<div class="container">
<div class="login-screen" id="loginScreen">
<div class="icon">💬</div>
<h1>شات</h1>
<p class="sub">تواصل مع <span>أصدقائك</span> بسهولة</p>
<input type="text" id="usernameInput" placeholder="✏️ اختر اسمك..." maxlength="20" autocomplete="off">
<button class="btn" id="joinBtn">🚀 دخول</button>
<p class="footer-text">🔒 خاص · آمن · <span>بدون حفظ</span></p>
</div>
<div class="chat-area" id="chatArea">
<div class="chat-header">
<div class="title">💬 شات <span class="beta">Beta</span></div>
<div class="users-online">👥 المتصلون: <span id="onlineCount">1</span></div>
</div>
<div class="main-chat">
<div class="users-list" id="usersList"><h4>📋 المستخدمين</h4><div id="usersContainer"></div></div>
<div class="messages-area" id="messagesArea"><div class="empty-state"><span class="emoji">💬</span>مرحباً! ابدأ المحادثة...</div></div>
</div>
<div class="input-area">
<div class="private-indicator" id="privateIndicator">🔒 مراسلة خاصة مع <span id="privateTarget"></span><span class="close" id="closePrivate">✕</span></div>
<input type="text" id="messageInput" placeholder="✍️ اكتب رسالتك..." disabled autocomplete="off">
<button class="btn" id="sendBtn">📤 إرسال</button>
</div>
</div>
</div>
<script>
(function(){
'use strict';
let cu='',pr=null,us=[],ms=[],mid=0;
const ls=document.getElementById('loginScreen'),ca=document.getElementById('chatArea'),ui=document.getElementById('usernameInput'),jb=document.getElementById('joinBtn'),uc=document.getElementById('usersContainer'),ma=document.getElementById('messagesArea'),mi=document.getElementById('messageInput'),sb=document.getElementById('sendBtn'),oc=document.getElementById('onlineCount'),pi=document.getElementById('privateIndicator'),pt=document.getElementById('privateTarget'),cp=document.getElementById('closePrivate');
function st(t){const d=document.createElement('div');d.textContent=t;return d.textContent}
function eh(t){const m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};return t.replace(/[&<>"']/g,function(c){return m[c]})}
function au(n){if(!us.find(u=>u.name===n)){us.push({name:n,online:true});ul();uo();return true}return false}
function ru(n){us=us.filter(u=>u.name!==n);ul();uo();if(pr===n){pr=null;up()}}
function ul(){if(us.length===0){uc.innerHTML='<div style="color:#64748b;font-size:.8rem;text-align:center;">لا يوجد مستخدمون</div>';return}uc.innerHTML=us.map(u=>'<div class="user-item'+(u.name===cu?' active':'')+'" onclick="spc(\''+u.name+'\')"><span class="dot'+(u.online?'':' offline')+'"></span><span class="name">'+eh(u.name)+(u.name===cu?' <span class="me">(أنت)</span>':'')+'</span>'+(pr===u.name?'<span class="private-badge">🔒 خاص</span>':'')+'</div>').join('')}
function uo(){const on=us.filter(u=>u.online).length;oc.textContent=on}
function am(t,s,p=false,tg=null){const msg={id:mid++,text:st(t),sender:st(s),isPrivate:p,target:tg?st(tg):null,time:new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})};ms.push(msg);rm()}
function rm(){let f=ms;if(pr){f=ms.filter(m=>(m.isPrivate&&(m.sender===cu||m.sender===pr)&&(m.target===cu||m.target===pr))||(m.sender===cu&&m.target===pr)||(m.sender===pr&&m.target===cu))}else{f=ms.filter(m=>!m.isPrivate)}if(f.length===0){ma.innerHTML='<div class="empty-state"><span class="emoji">💬</span>'+(pr?'🔒 محادثة خاصة مع '+eh(pr):'مرحباً! ابدأ المحادثة...')+'</div>';return}ma.innerHTML=f.map(m=>{const ow=m.sender===cu,prv=m.isPrivate;let cls='message';if(ow)cls+=' own';else if(prv)cls+=' private';else cls+=' other';let lab='';if(prv&&!ow)lab='<span class="sender private-label">🔒 خاص من '+eh(m.sender)+'</span>';else if(!ow)lab='<span class="sender">'+eh(m.sender)+'</span>';else if(prv)lab='<span class="sender private-label">🔒 خاص إلى '+eh(m.target)+'</span>';if(m.sender==='النظام')cls+=' system';return'<div class="'+cls+'">'+lab+eh(m.text)+'<span class="time">'+m.time+'</span></div>'}).join('');ma.scrollTop=ma.scrollHeight}
window.spc=function(n){if(n===cu)return;if(pr===n){pr=null;up();rm();return}pr=n;up();rm();mi.focus()};
function up(){if(pr){pi.classList.add('show');pt.textContent=eh(pr)}else{pi.classList.remove('show')}}
function sm(){const t=mi.value.trim();if(!t||!cu)return;if(pr){am(t,cu,true,pr)}else{am(t,cu,false)}mi.value='';mi.focus()}
function jc(){const n=ui.value.trim();if(!n||n.length<2){alert('⚠️ الاسم لا يقل عن حرفين');return}if(n.length>20){alert('⚠️ الاسم لا يزيد عن 20 حرف');return}if(n.includes('<')||n.includes('>')||n.includes('script')){alert('⚠️ اسم غير صالح');return}cu=st(n);if(!au(cu)){alert('⚠️ هذا الاسم مستخدم');return}ls.style.display='none';ca.classList.add('show');mi.disabled=false;mi.focus();am('👋 مرحباً '+cu+'! أهلاً بك في شات','النظام',false);am('💡 اضغط على اسم مستخدم لمراسلته خاصاً','النظام',false)}
jb.addEventListener('click',jc);ui.addEventListener('keydown',(e)=>{if(e.key==='Enter')jc()});sb.addEventListener('click',sm);mi.addEventListener('keydown',(e)=>{if(e.key==='Enter')sm()});cp.addEventListener('click',()=>{pr=null;up();rm()});
window.addEventListener('beforeunload',function(){if(cu){ru(cu)}});
console.log('💬 شات جاهز! اضغط على اسم مستخدم للخاص');
})();
</script>
</body>
</html>
