<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع يوسف - Bongo Cat</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e2f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-container {
            background: #2a2a40;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            text-align: center;
            width: 380px;
            border: 1px solid #3f3f5f;
        }

        h2 { margin-top: 0; color: #ffb703; }

        input[type="text"] {
            width: 90%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4f4f7f;
            background: #151522;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #ffb703;
        }

        /* حاوية بونجو كات في أسفل الشاشة */
        #bongo-cat-wrapper {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .cat-box {
            position: relative;
            width: 140px;
            height: 90px;
            background: #ffb703;
            border-radius: 70px 70px 20px 20px;
            border: 4px solid #151522;
            box-shadow: 0 6px 0 #151522;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* أذان القطة */
        .ear {
            position: absolute;
            top: -18px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #ffb703;
        }
        .ear.left { left: 15px; transform: rotate(-15deg); }
        .ear.right { right: 15px; transform: rotate(15deg); }

        /* وجه القطة */
        .face {
            font-size: 24px;
            letter-spacing: 6px;
            margin-top: 10px;
        }

        /* الكيبورد بالأفل */
        .keyboard-desk {
            width: 180px;
            height: 25px;
            background: #4a4e69;
            border-radius: 6px;
            border: 3px solid #151522;
            margin-top: -5px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 5px;
        }

        .key {
            width: 12px;
            height: 8px;
            background: #f2e9e4;
            border-radius: 2px;
            transition: transform 0.05s;
        }

        /* كفوف القطة التفاعلية */
        .paws {
            position: absolute;
            bottom: -10px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 30px;
        }

        .paw {
            width: 22px;
            height: 16px;
            background: #fb8500;
            border: 3px solid #151522;
            border-radius: 50%;
            transition: transform 0.05s ease;
        }

        /* حركة الكفوف عند الكتابة */
        .typing-active .paw.left-paw {
            transform: translateY(-12px) translateX(5px);
        }
        .typing-active .paw.right-paw {
            transform: translateY(-2px) translateX(-5px);
        }
        
        .alt-type .paw.left-paw {
            transform: translateY(-2px) translateX(5px);
        }
        .alt-type .paw.right-paw {
            transform: translateY(-12px) translateX(-5px);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>موقع يوسف</h2>
        <p>جرب تكتب أي شي وشوف تفاعل القطة:</p>
        <input type="text" id="userInput" placeholder="اكتب هنا...">
    </div>

    <!-- رسمة Bongo Cat -->
    <div id="bongo-cat-wrapper">
        <div class="cat-box" id="catBody">
            <div class="ear left"></div>
            <div class="ear right"></div>
            <div class="face">>^.^<</div>
            <div class="paws">
                <div class="paw left-paw"></div>
                <div class="paw right-paw"></div>
            </div>
        </div>
        <div class="keyboard-desk">
            <div class="key"></div>
            <div class="key"></div>
            <div class="key"></div>
            <div class="key"></div>
            <div class="key"></div>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('userInput');
        const catBody = document.getElementById('catBody');
        let toggleHand = false;

        // التفاعل السريع مع كل حرف يُكتب
        inputField.addEventListener('keydown', () => {
            toggleHand = !toggleHand;
            if (toggleHand) {
                catBody.classList.add('typing-active');
                catBody.classList.remove('alt-type');
            } else {
                catBody.classList.remove('typing-active');
                catBody.classList.add('alt-type');
            }

            // إرجاع الكفوف لوضعيتها العادية عند التوقف السريع
            clearTimeout(window.catTimeout);
            window.catTimeout = setTimeout(() => {
                catBody.classList.remove('typing-active');
                catBody.classList.remove('alt-type');
            }, 150);
        });

        // حركة خفيفة للقطة مع الماوس
        document.addEventListener('mousemove', (e) => {
            let moveX = (e.clientX / window.innerWidth - 0.5) * 20;
            document.getElementById('bongo-cat-wrapper').style.transform = `translateX(calc(-50% + ${moveX}px))`;
        });
    </script>

</body>
</html>
